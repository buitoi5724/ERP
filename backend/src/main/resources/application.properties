# ===================================================================
# DATABASE CONFIGURATION (SQL SERVER)
# ===================================================================
# jdbc:sqlserver://localhost:1433 : protocol, host, and port of SQL Server
# databaseName=erp : name of the database
# encrypt=true;trustServerCertificate=true : required for modern SQL Server drivers
# useUnicode=true;characterEncoding=UTF-8 : important for correct Vietnamese text handling
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=erp;encrypt=true;trustServerCertificate=true;useUnicode=true;characterEncoding=UTF-8

# SQL Server username
spring.datasource.username=sa

# SQL Server password
spring.datasource.password=123456

# JDBC driver class
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===================================================================
# HIBERNATE CONFIGURATION
# ===================================================================
# ddl-auto: update (keep data), create (drop & recreate), none (manual)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# UTF-8 encoding for Hibernate connection
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8


# ===================================================================
# WEB ENCODING CONFIGURATION
# ===================================================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true


# ===================================================================
# CUSTOM APPLICATION CONFIGURATION
# ===================================================================
# Path for saving uploaded product images
upload.folder=D:/uploads/product


# ===================================================================
# FILE UPLOAD CONFIGURATION (PH\u1EA6N M\u1EDAI THÊM VÀO)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB